name: QA Automation Suite

on:
  push:
    branches: [main, develop, "claude/**"]
  pull_request:
    branches: [main]

# Cancel redundant runs triggered by fast pushes to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Unit & Integration Tests ────────────────────────────────────────
  unit-and-integration:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      - name: Generate coverage report
        run: |
          pytest tests/unit/ tests/integration/ \
            --cov=tests \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage-py${{ matrix.python-version }}.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: reports/coverage-py${{ matrix.python-version }}.xml
          retention-days: 14

  # ── Job 2: Selenium E2E Tests ───────────────────────────────────────────────
  selenium:
    name: Selenium E2E Tests
    runs-on: ubuntu-latest
    needs: unit-and-integration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Google Chrome
        run: |
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Selenium login tests
        run: |
          pytest tests/test_login.py -v --tb=short \
            --html=reports/login-report.html --self-contained-html
        env:
          HEADLESS: "true"
          BROWSER: "chrome"
          SCREENSHOT_ON_FAILURE: "true"

      - name: Run Selenium search tests
        run: |
          pytest tests/test_search.py -v --tb=short \
            --html=reports/search-report.html --self-contained-html
        env:
          HEADLESS: "true"
          BROWSER: "chrome"
          SCREENSHOT_ON_FAILURE: "true"

      - name: Run Selenium form tests
        run: |
          pytest tests/test_form.py -v --tb=short \
            --html=reports/form-report.html --self-contained-html
        env:
          HEADLESS: "true"
          BROWSER: "chrome"
          SCREENSHOT_ON_FAILURE: "true"

      - name: Upload HTML test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-html-reports
          path: reports/
          retention-days: 14

  # ── Job 3: Playwright E2E Tests (legacy 8D QMS suite) ──────────────────────
  playwright:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: unit-and-integration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Playwright smoke tests
        run: |
          pytest tests/e2e/ -v --tb=short \
            --browser chromium --headed=false \
            -k "not requires_server"
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
