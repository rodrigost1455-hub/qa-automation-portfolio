[pytest]
asyncio_mode = auto

# ── Test discovery ────────────────────────────────────────────────────────────
testpaths = tests

# ── Output defaults ───────────────────────────────────────────────────────────
addopts =
    --tb=short
    -v

# ── Custom markers ────────────────────────────────────────────────────────────
markers =
    selenium: Tests that drive a real browser via Selenium WebDriver
    smoke:    Subset of critical-path tests for fast pre-deploy checks
    slow:     Tests with above-average execution time
    e2e:      Full end-to-end tests against live applications
